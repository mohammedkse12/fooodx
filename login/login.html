<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | منصة الغذاء التجارية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login_style.css">
    <style>

    </style>
</head>

<body>

    <div class="login-container">
        <div class="logo-container">
            <img src="imges/logo.jpg" alt="logo">
            <h2>FOOFX</h2>
            <p>مرحباً بك مجدداً، الرجاء تسجيل الدخول إلى حسابك</p>
        </div>

        <form action="#" method="POST">

            <div class="form-group">
                <label for="userId">اسم المستخدم أو المعرّف (ID)<span style="color: #e74c3c;">*</span></label>
                <input type="text" id="userId" name="user_id" placeholder="أدخل اسم المستخدم" required>
            </div>

            <div class="form-group">
                <label for="passwordField">كلمة المرور<span style="color: #e74c3c;">*</span></label>
                <div class="password-wrapper">
                    <input type="password" id="passwordField" name="password" placeholder="أدخل كلمة المرور الخاصة بك"
                        required>
                    <button type="button" id="togglePassword"
                        style="position: absolute; left: 10px; top: 10px; background: rgb(238, 240, 238);padding: 5px; border: 1px solid #007e5e;border-radius: 10px; cursor: pointer; font-size: 12px;">
                        اظهار
                    </button>
                </div>
            </div>

            <!-- <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" name="remember_me">
                    تذكرني على هذا الجهاز
                </label>
                <a href="#" class="forgot-password"
                    onclick="alert('سيتم توجيهك لصفحة استعادة كلمة المرور عبر الـ OTP قريباً.')">نسيت كلمة المرور؟</a>
            </div> -->

            <button type="submit" class="submit-btn">تسجيل الدخول</button>
            <p class="pp">ليس لديك حساب مسجل في المنصة؟</p>

            <div class="signup-divider">
                <a href="factory_signUp.html" target="_blank" class="redirect-btn" id="signupRedirect">إنشاء حساب
                    مورد</a>
                <a href="merchant_signUp.html" target="_blank" class="redirect-btn">إنشاء حساب تاجر</a>
            </div>
        </form>
    </div>

    <script src="login.js"></script>
</body>

</html>
